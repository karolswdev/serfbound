# Mailbox service (SB-29-02). Same posture as identity: one replica,
# Recreate over the RWO store volume, TCP probes, no code changes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailbox-store
  namespace: serfbound
  labels:
    app.kubernetes.io/part-of: serfbound
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailbox
  namespace: serfbound
  labels:
    app.kubernetes.io/name: mailbox
    app.kubernetes.io/part-of: serfbound
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailbox
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailbox
        app.kubernetes.io/part-of: serfbound
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: mailbox
          image: ghcr.io/karolswdev/serfbound-mailbox:latest
          ports:
            - name: http
              containerPort: 4320
          env:
            - name: SERFBOUND_MAILBOX_STORE
              value: /data/matches.json
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: store
              mountPath: /data
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: mailbox-store
---
apiVersion: v1
kind: Service
metadata:
  name: mailbox
  namespace: serfbound
  labels:
    app.kubernetes.io/name: mailbox
    app.kubernetes.io/part-of: serfbound
spec:
  selector:
    app.kubernetes.io/name: mailbox
  ports:
    - name: http
      port: 80
      targetPort: http
