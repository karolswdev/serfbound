# Maps service (SB-43-02). Same posture as identity/mailbox: one
# replica, Recreate over the RWO store volume, TCP probes, no code
# changes. Stores published custom maps (enum bytes + metadata) — never
# original game data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: maps-store
  namespace: serfbound
  labels:
    app.kubernetes.io/part-of: serfbound
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maps
  namespace: serfbound
  labels:
    app.kubernetes.io/name: maps
    app.kubernetes.io/part-of: serfbound
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: maps
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maps
        app.kubernetes.io/part-of: serfbound
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: maps
          image: ghcr.io/karolswdev/serfbound-maps:latest
          ports:
            - name: http
              containerPort: 4330
          env:
            - name: SERFBOUND_MAPS_STORE
              value: /data/maps.json
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: store
              mountPath: /data
      volumes:
        - name: store
          persistentVolumeClaim:
            claimName: maps-store
---
apiVersion: v1
kind: Service
metadata:
  name: maps
  namespace: serfbound
  labels:
    app.kubernetes.io/name: maps
    app.kubernetes.io/part-of: serfbound
spec:
  selector:
    app.kubernetes.io/name: maps
  ports:
    - name: http
      port: 80
      targetPort: http
