# Serfbound owns exactly one namespace on the shared cluster
# (hosting-infrastructure decision record, SB-29-01).
apiVersion: v1
kind: Namespace
metadata:
  name: serfbound
  labels:
    app.kubernetes.io/part-of: serfbound
    # Grants HTTPRoute attachment to the shared catalyst-gateway
    # (its allowedRoutes selector), per the SB-29-03 ingress decision.
    catalyst.io/gateway-access: "true"
