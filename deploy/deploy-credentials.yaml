# Namespace-scoped deploy credential (SB-29-01 secrets boundary):
# routine operations use this ServiceAccount, never the cluster-admin
# token. It can manage Serfbound's own namespace and nothing else —
# the gateway patch and the Certificate are admin one-time operations
# by design.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serfbound-deployer
  namespace: serfbound
  labels:
    app.kubernetes.io/part-of: serfbound
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: serfbound-deployer
  namespace: serfbound
  labels:
    app.kubernetes.io/part-of: serfbound
rules:
  - apiGroups: ["", "apps", "batch"]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - persistentvolumeclaims
      - configmaps
      - secrets
      - deployments
      - replicasets
      - jobs
      - cronjobs
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: serfbound-deployer
  namespace: serfbound
  labels:
    app.kubernetes.io/part-of: serfbound
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: serfbound-deployer
subjects:
  - kind: ServiceAccount
    name: serfbound-deployer
    namespace: serfbound
---
apiVersion: v1
kind: Secret
metadata:
  name: serfbound-deployer-token
  namespace: serfbound
  labels:
    app.kubernetes.io/part-of: serfbound
  annotations:
    kubernetes.io/service-account.name: serfbound-deployer
type: kubernetes.io/service-account-token
