name: Serfbound bug report
description: Report a problem with the browser game.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Serfbound issue. Do not attach original DOS/Amiga data files.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 126, Firefox 127, Safari 18"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Phone
        - Tablet
    validations:
      required: true
  - type: dropdown
    id: pwa
    attributes:
      label: Installed as a PWA?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: data-source
    attributes:
      label: Data source
      description: Pick the closest match. Never upload original data to GitHub.
      options:
        - No data imported
        - Imported local SPAU.PA
        - Licensed package
        - Custom map
        - Not sure
    validations:
      required: true
  - type: textarea
    id: error-report
    attributes:
      label: Copy error report output
      description: In the game side panel, press "Copy error report" and paste the JSON here when available.
      render: json
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
  - type: checkboxes
    id: asset-boundary
    attributes:
      label: Asset boundary
      options:
        - label: I did not attach original DOS/Amiga game data, extracted sprites, music, sounds, disk images, or executables.
          required: true
